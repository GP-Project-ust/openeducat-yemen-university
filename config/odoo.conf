[options]
; عنوان أودو: تُضبط قاعدة البيانات عبر متغيرات البيئة في docker-compose
admin_passwd = admin
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/openeducat_erp
data_dir = /var/lib/odoo
; قاعدة واحدة جاهزة — نخفي مدير القواعد لتجربة آمنة ومباشرة
list_db = False
; وضع التطوير المحلي: خيط واحد يخدم الويب و websocket على 8069
workers = 0
log_level = info
; حدود الذاكرة لجهاز محلي متواضع
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
